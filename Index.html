<!-- FILE 1: index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Autonomous Neural-Cellular Automata Simulation with N-Body Physics">
    <title>Autonomous Neural-Raster Simulation Matrix</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            width: 100%; height: 100%;
            background-color: #030305;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        
        #container {
            display: grid;
            grid-template-columns: 1fr 320px;
            width: 100vw; height: 100vh;
        }
        
        #canvas-wrapper {
            position: relative;
            width: 100%; height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        /* Fallback message for no canvas support */
        .no-canvas-fallback {
            display: none;
            text-align: center;
            color: #ff0055;
            padding: 20px;
        }
        
        canvas:not(:defined) ~ .no-canvas-fallback {
            display: block;
        }
        
        #sidebar {
            background: #08090c;
            border-left: 1px solid #1a1d24;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            overflow-y: auto;
            max-height: 100vh;
        }
        
        .telemetry-box {
            background: #0d0f14;
            border: 1px solid #222733;
            padding: 12px;
            border-radius: 4px;
            min-width: 0;
        }
        
        .telemetry-box h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #56617a;
            margin-bottom: 8px;
        }
        
        .metric {
            font-size: 14px;
            font-weight: bold;
            color: #00ffcc;
            word-break: break-word;
        }
        
        .btn {
            background: #00ffcc;
            color: #030305;
            border: none;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s ease;
            border-radius: 2px;
            font-size: 12px;
        }
        
        .btn:hover {
            background: #00cca3;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        /* Responsive design for small screens */
        @media (max-width: 768px) {
            #container {
                grid-template-columns: 1fr;
            }
            
            #sidebar {
                grid-row: 2;
                padding: 10px;
                gap: 10px;
                max-height: 200px;
            }
            
            .telemetry-box {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-wrapper">
            <canvas id="matrixCanvas" aria-label="Simulation visualization canvas"></canvas>
            <div class="no-canvas-fallback">
                <p>Your browser does not support HTML5 Canvas.</p>
                <p>Please use a modern browser to view this simulation.</p>
            </div>
        </div>
        <div id="sidebar">
            <div class="telemetry-box">
                <h3>System Architecture</h3>
                <div class="metric">Zero-Dependency ES6</div>
            </div>
            <div class="telemetry-box">
                <h3>Frame Telemetry</h3>
                <div id="fpsMetric" class="metric">FPS: 0.0</div>
                <div id="frameTime" class="metric" style="margin-top:5px; font-size:11px; color:#888;">Frame: 0ms</div>
            </div>
            <div class="telemetry-box">
                <h3>Active Nodes</h3>
                <div id="nodeCount" class="metric">16,384 Entities</div>
            </div>
            <div class="telemetry-box">
                <h3>Entropy Index</h3>
                <div id="entropyMetric" class="metric">0.0000</div>
            </div>
            <button class="btn" id="toggleModeBtn" type="button">Toggle Phase Mode</button>
            <button class="btn" id="perturbBtn" type="button" style="background:#ff0055; color:#fff;">Inject Entropy Spike</button>
        </div>
    </div>
    
    <script type="module" src="./Controller.js"></script>
    <noscript>
        <div style="color: #ff0055; padding: 20px; text-align: center;">
            <p>This application requires JavaScript to be enabled.</p>
        </div>
    </noscript>
</body>
</html>
